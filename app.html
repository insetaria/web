<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link href="./assets/img/logos/icon.png" rel="icon">
<meta name="theme-color" content="#4CAF50">
<title>Insectaria</title>
<style>
*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html {
    scroll-behavior: smooth;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f7f7f7;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    -webkit-font-smoothing: antialiased;
    padding: 1.25rem;
}
#app {
    display: none;
    width: 100%;
    max-width: 420px;
}
.card {
    background: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    padding: clamp(2rem, 5vw, 3rem);
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.logo {
    width: 170px;
    height: auto;
    margin-bottom: 0.75rem;
    display: inline-block;
    font-size: 1.6rem;
    font-weight: 800;
    color: #000;
    font-family: inherit;
}

.sub {
    font-size: 0.95rem;
    color: #666;
    margin-bottom: 2rem;
}
#loginBtn {
    width: 100%;
    padding: 0.85rem 1.5rem;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: #4CAF50;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    touch-action: manipulation;
}
#loginBtn:hover {
    background: #43a047;
}
#loginBtn:active {
    transform: scale(0.97);
}
#loginBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}
#loginBtn .g-icon {
    width: 20px;
    height: 20px;
}
.error {
    margin-top: 1.25rem;
    font-size: 0.85rem;
    color: #d32f2f;
    line-height: 1.5;
    display: none;
}
.error.show {
    display: block;
}
.loading {
    display: none;
    margin-top: 1.25rem;
    font-size: 0.9rem;
    color: #666;
}
.loading.show {
    display: block;
}
.loading .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(76,175,80,0.3);
    border-top-color: #4CAF50;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 0.5rem;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 480px) {
    body {
        padding: 0.75rem;
    }
    .card {
        padding: 1.75rem 1.5rem;
        border-radius: 12px;
    }
    .logo {
        width: 140px;
    }
}
</style>
</head>
<body>
<div id="app">
    <div class="card" id="card">
        <img src="./assets/img/logos/logo.png" alt="INSECTARIA" class="logo">
        <p class="sub" id="sub">Accede a la aplicación</p>
        <button id="loginBtn">
            <svg class="g-icon" viewBox="0 0 24 24"><path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Iniciar sesión con Google
        </button>
        <div class="loading" id="loading"><span class="spinner"></span><span id="loadingMsg">Verificando acceso...</span></div>
        <div class="error" id="error"></div>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function() {
    var _d = atob;
    var HASH_ID = _d("MTNPSm9TSFo2d0d2cU1mSHV4eEV6NGVoZWJiaFFWTGxh");
    var HASH_FAILOVER = _d("UExBQ0VIT0xERVJfSEFTSF9GQUlMT1ZFUl9EUklWRV9GSUxFX0lE");
    var CLIENT_ID = _d("Njc1MzQzMTMzMzAtYzZ0ZWEyYXAwNWU3Nmk1Ymg3OTRoYW1hYjNwbWUxbjkuYXBwcy5nb29nbGV1c2VyY29udGVudC5jb20=");
    var SCOPES = "https://www.googleapis.com/auth/drive.readonly";

    var APP = document.getElementById("app");
    var CARD = document.getElementById("card");
    var LOGIN_BTN = document.getElementById("loginBtn");
    var ERROR_EL = document.getElementById("error");
    var LOADING_EL = document.getElementById("loading");
    var LOADING_MSG = document.getElementById("loadingMsg");

    function showError(m) {
        ERROR_EL.textContent = m;
        ERROR_EL.classList.add("show");
        LOADING_EL.classList.remove("show");
        LOGIN_BTN.disabled = false;
    }

    function showLoading(m) {
        LOADING_MSG.textContent = m || "Verificando acceso...";
        LOADING_EL.classList.add("show");
        LOGIN_BTN.disabled = true;
    }

    function hideLoading() {
        LOADING_EL.classList.remove("show");
        LOGIN_BTN.disabled = false;
    }

    async function loadBundle(fid, token) {
        CARD.style.display = "none";
        try {
            var r = await fetch("https://www.googleapis.com/drive/v3/files/" + fid + "?alt=media", {
                headers: { Authorization: "Bearer " + token }
            });
            if (!r.ok) throw new Error();
            var code = await r.text();

            document.body.innerHTML = "";
            document.body.style.cssText = "";
            document.querySelectorAll("style, link[rel=stylesheet]").forEach(function(el) { el.remove(); });

            var blob = new Blob([code], { type: "text/javascript" });
            var url = URL.createObjectURL(blob);
            var mod = await import(url);
            if (mod.initApp) await mod.initApp();
        } catch(e) {
            document.body.innerHTML = "";
            document.body.style.cssText = "display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#444;font-size:1rem;";
            document.body.textContent = "No hay datos registrados para tu usuario en la aplicaci\u00f3n";
        }
    }

    async function checkAccess(token) {
        showLoading("Verificando acceso...");
        try {
            var r1 = await fetch("https://www.googleapis.com/drive/v3/files/" + HASH_ID + "?fields=id", {
                headers: { Authorization: "Bearer " + token }
            });
            if (r1.ok) { await loadBundle(HASH_ID, token); return; }

            var r2 = await fetch("https://www.googleapis.com/drive/v3/files/" + HASH_FAILOVER + "?fields=id", {
                headers: { Authorization: "Bearer " + token }
            });
            if (r2.ok) { await loadBundle(HASH_FAILOVER, token); return; }

            hideLoading();
            showError("No hay datos registrados para tu usuario en la aplicaci\u00f3n");
        } catch(e) {
            hideLoading();
            showError("No hay datos registrados para tu usuario en la aplicaci\u00f3n");
        }
    }

    (async function() {
        APP.style.display = "block";

        var gsiReady = false;
        try {
            if (typeof google !== "undefined" && google.accounts && google.accounts.oauth2) {
                gsiReady = true;
            } else {
                await new Promise(function(resolve) {
                    var iv = setInterval(function() {
                        if (typeof google !== "undefined" && google.accounts && google.accounts.oauth2) {
                            clearInterval(iv);
                            gsiReady = true;
                            resolve();
                        }
                    }, 50);
                    setTimeout(function() { clearInterval(iv); resolve(); }, 15000);
                });
            }
        } catch(e) {}

        var tokenClient = null;
        if (gsiReady) {
            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: function(resp) {
                        if (resp.error) {
                            showError("Tu usuario no tiene acceso a la aplicaci\u00f3n");
                            return;
                        }
                        var at = resp.access_token;
                        window.__launcher = { accessToken: at, clientId: CLIENT_ID };
                        localStorage.setItem("_accessToken", at);
                        localStorage.setItem("_clientId", CLIENT_ID);
                        checkAccess(at);
                    }
                });
            } catch(e) {}
        }

        LOGIN_BTN.addEventListener("click", function() {
            ERROR_EL.classList.remove("show");
            if (!tokenClient) {
                showError("Tu usuario no tiene acceso a la aplicaci\u00f3n");
                return;
            }
            tokenClient.requestAccessToken();
        });
    })();
})();
</script>
</body>
</html>
